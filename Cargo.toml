[package]
name = "wallbreak"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Experimental image/video and one-scene wallpaper player for Wayland layer-shell compositors"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
lz4_flex = "0.11"
texture2ddecoder = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
wayland-client = "0.31"

[dev-dependencies]
rustix = { version = "1.1", features = ["process"] }
tempfile = "3.20"
