[package]
name = "wallbreak"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["flakesonnix"]
description = "Experimental image/video and one-scene wallpaper player for Wayland layer-shell compositors"
homepage = "https://github.com/flakesonnix/wallbreak"
repository = "https://github.com/flakesonnix/wallbreak"
license = "MIT"
publish = false
default-run = "wallbreak"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
lz4_flex = "0.11"
texture2ddecoder = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
rustix = { version = "1.1", features = ["fs", "process"] }
url = "2.5"
zbus = "=5.13.2"
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
eframe = { version = "0.28", default-features = false, features = [
  "glow",
  "wayland",
  "default_fonts",
], optional = true }

[features]
gui = ["dep:eframe"]

[[bin]]
name = "wallbreak-gui"
path = "src/bin/wallbreak-gui.rs"
required-features = ["gui"]

[[bin]]
name = "wallbreak-renderer"
path = "src/bin/wallbreak-renderer.rs"
required-features = ["gui"]

[dev-dependencies]
tempfile = "3.20"
